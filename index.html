<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bayang-Bayang: Shadows of Perak</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      color: #f4ecd8;
      font-family: -apple-system, BlinkMacSystemFont, 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overscroll-behavior: none;
    }

    #game-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px 0 8px;
    }

    #viewport-container {
      position: relative;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #12141d;
      border: 3px solid #d3b15f;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    canvas#gameCanvas {
      width: 100%;
      height: auto;
      max-height: 48vh;
      aspect-ratio: 4/3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #000;
      display: block;
    }

    #ui-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #d3b15f;
      background: #181d28;
      border-top: 1px solid #2b3345;
    }

    /* TOUCH CONTROLS */
    #touch-controls {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px calc(14px + env(safe-area-inset-bottom)) 24px;
      touch-action: none;
    }

    /* D-PAD STYLING */
    .dpad {
      position: relative;
      width: 140px;
      height: 140px;
      touch-action: none;
    }
    .d-btn {
      position: absolute;
      width: 46px;
      height: 46px;
      background: #232938;
      border: 2px solid #5a6273;
      border-radius: 10px;
      color: #d3b15f;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 0 #0d1017;
      cursor: pointer;
    }
    .d-btn.active, .d-btn:active {
      background: #48546e;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d1017;
      color: #00f0ff;
    }
    .d-up    { top: 0; left: 47px; }
    .d-down  { bottom: 0; left: 47px; }
    .d-left  { top: 47px; left: 0; }
    .d-right { top: 47px; right: 0; }
    .d-center {
      position: absolute;
      top: 47px;
      left: 47px;
      width: 46px;
      height: 46px;
      background: #141722;
      border-radius: 4px;
    }

    /* ACTION BUTTON */
    #action-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #2b3345;
      border: 3px solid #d3b15f;
      color: #d3b15f;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #12141d;
      cursor: pointer;
      touch-action: none;
    }
    #action-btn.active, #action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #12141d;
      background: #3f4c66;
    }

    /* POPUP OVERLAY */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(14, 17, 25, 0.96);
      border: 2px solid #d3b15f;
      padding: 20px 24px;
      text-align: center;
      border-radius: 10px;
      z-index: 50;
      display: none;
      width: 82%;
      max-width: 320px;
      box-shadow: 0 0 24px rgba(0,0,0,0.9);
    }
    #message h2 {
      color: #d3b15f;
      margin-bottom: 8px;
      font-size: 18px;
    }
    #message p {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
      color: #f4ecd8;
    }
    #restartBtn {
      background: #d3b15f;
      color: #0b0d13;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="viewport-container">
      <canvas id="gameCanvas" width="320" height="240"></canvas>
      <div id="ui-bar">
        <span>SANITI: <span id="sanityVal">100</span>%</span>
        <span>BATERI: <span id="batteryVal">100</span>%</span>
      </div>
      <div id="message">
        <h2 id="msgTitle">Bayang-Bayang</h2>
        <p id="msgBody">Bayang-bayang gelap mendekat! Cari portal emas di bucu atas kanan.</p>
        <button id="restartBtn">MULA SEMULA</button>
      </div>
    </div>
  </div>

  <div id="touch-controls">
    <div class="dpad">
      <div class="d-center"></div>
      <div class="d-btn d-up" data-dir="up">▲</div>
      <div class="d-btn d-down" data-dir="down">▼</div>
      <div class="d-btn d-left" data-dir="left">◀</div>
      <div class="d-btn d-right" data-dir="right">▶</div>
    </div>
    <div id="action-btn">
      <span>LAMPU</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    let player = { x: 30, y: 120, w: 10, h: 14, speed: 1.6 };
    let moveDir = { up: false, down: false, left: false, right: false };
    let shadows = [];
    let sanity = 100;
    let battery = 100;
    let gameOver = false;
    let won = false;
    let lightOn = false;
    let exit = { x: 285, y: 25, w: 22, h: 22 };
    let trees = [];
    let time = 0;

    function initObstacles() {
      trees = [];
      while (trees.length < 15) {
        const candidate = {
          x: 45 + Math.random() * 230,
          y: 20 + Math.random() * 200,
          r: 6 + Math.random() * 7
        };
        const distStart = Math.hypot(candidate.x - player.x, candidate.y - player.y);
        const distExit = Math.hypot(candidate.x - exit.x, candidate.y - exit.y);
        if (distStart > 40 && distExit > 40) {
          trees.push(candidate);
        }
      }
    }

    function spawnShadows() {
      shadows = [];
      for (let i = 0; i < 4; i++) {
        shadows.push({
          x: 120 + Math.random() * 140,
          y: 30 + Math.random() * 180,
          vx: (Math.random() - 0.5) * 0.7,
          vy: (Math.random() - 0.5) * 0.7,
          size: 11 + Math.random() * 6
        });
      }
    }

    initObstacles();
    spawnShadows();

    // Keyboard support (if on iPad with keyboard or Mac)
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') moveDir.up = true;
      if (k === 'arrowdown' || k === 's') moveDir.down = true;
      if (k === 'arrowleft' || k === 'a') moveDir.left = true;
      if (k === 'arrowright' || k === 'd') moveDir.right = true;
      if (k === ' ' || k === 'enter') toggleLight();
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') moveDir.up = false;
      if (k === 'arrowdown' || k === 's') moveDir.down = false;
      if (k === 'arrowleft' || k === 'a') moveDir.left = false;
      if (k === 'arrowright' || k === 'd') moveDir.right = false;
    });

    // POINTER/TOUCH CONTROLS (Handles multi-finger presses cleanly)
    document.querySelectorAll('.d-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const start = (e) => {
        e.preventDefault();
        moveDir[dir] = true;
        btn.classList.add('active');
      };
      const end = (e) => {
        e.preventDefault();
        moveDir[dir] = false;
        btn.classList.remove('active');
      };

      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', end);
      btn.addEventListener('pointercancel', end);
      btn.addEventListener('pointerleave', end);
    });

    const actBtn = document.getElementById('action-btn');
    actBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      actBtn.classList.add('active');
      toggleLight();
    });
    actBtn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      actBtn.classList.remove('active');
    });

    function toggleLight() {
      if (gameOver) return;
      if (battery > 5) {
        lightOn = !lightOn;
      }
    }

    function resetGame() {
      player.x = 30;
      player.y = 120;
      sanity = 100;
      battery = 100;
      gameOver = false;
      won = false;
      lightOn = false;
      moveDir = { up: false, down: false, left: false, right: false };
      initObstacles();
      spawnShadows();
      document.getElementById('message').style.display = 'none';
      document.getElementById('sanityVal').textContent = 100;
      document.getElementById('batteryVal').textContent = 100;
    }

    document.getElementById('restartBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resetGame();
    });

    function update() {
      if (gameOver) return;
      time++;

      let dx = 0, dy = 0;
      if (moveDir.up) dy -= 1;
      if (moveDir.down) dy += 1;
      if (moveDir.left) dx -= 1;
      if (moveDir.right) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx = (dx / len) * player.speed;
        dy = (dy / len) * player.speed;
      }

      let nx = player.x + dx;
      let ny = player.y + dy;
      let blocked = false;

      for (const t of trees) {
        const dist = Math.hypot(nx + player.w / 2 - t.x, ny + player.h / 2 - t.y);
        if (dist < t.r + 5) { blocked = true; break; }
      }

      if (!blocked) {
        player.x = Math.max(4, Math.min(W - player.w - 4, nx));
        player.y = Math.max(4, Math.min(H - player.h - 4, ny));
      }

      // Battery logic
      if (lightOn) {
        battery -= 0.35;
        if (battery <= 0) {
          battery = 0;
          lightOn = false;
        }
      } else {
        if (battery < 100) battery += 0.12;
      }
      document.getElementById('batteryVal').textContent = Math.floor(battery);

      // Shadow logic
      for (const s of shadows) {
        const dist = Math.hypot(player.x - s.x, player.y - s.y);

        if (lightOn && dist < 80) {
          const angle = Math.atan2(s.y - player.y, s.x - player.x);
          s.vx += Math.cos(angle) * 0.08;
          s.vy += Math.sin(angle) * 0.08;
        } else {
          const angle = Math.atan2(player.y - s.y, player.x - s.x);
          s.vx += Math.cos(angle) * 0.02;
          s.vy += Math.sin(angle) * 0.02;
        }

        const spd = Math.hypot(s.vx, s.vy);
        const maxSpd = lightOn ? 1.6 : 0.9;
        if (spd > maxSpd) {
          s.vx = (s.vx / spd) * maxSpd;
          s.vy = (s.vy / spd) * maxSpd;
        }

        s.x += s.vx;
        s.y += s.vy;

        if (s.x < 10 || s.x > W - 10) s.vx *= -1;
        if (s.y < 10 || s.y > H - 10) s.vy *= -1;

        if (dist < 45) {
          sanity -= lightOn ? 0.04 : 0.22;
        }
        if (dist < 15) {
          sanity -= 1.0;
        }
      }

      sanity = Math.max(0, Math.min(100, sanity));
      document.getElementById('sanityVal').textContent = Math.floor(sanity);

      if (sanity <= 0) {
        gameOver = true;
        document.getElementById('msgTitle').textContent = 'TEWAS';
        document.getElementById('msgBody').textContent = 'Bayang-bayang telah menelan kewarasan kamu.';
        document.getElementById('message').style.display = 'block';
      }

      if (player.x + player.w > exit.x && player.x < exit.x + exit.w &&
          player.y + player.h > exit.y && player.y < exit.y + exit.h) {
        gameOver = true;
        won = true;
        document.getElementById('msgTitle').textContent = 'TERLEPAS!';
        document.getElementById('msgBody').textContent = 'Kamu berjaya keluar ke kawasan yang selamat!';
        document.getElementById('message').style.display = 'block';
      }
    }

    function draw() {
      ctx.fillStyle = '#0a0c12';
      ctx.fillRect(0, 0, W, H);

      // Grass texture
      ctx.fillStyle = '#12151c';
      for (let i = 0; i < 30; i++) {
        ctx.fillRect((i * 41) % W, (i * 29) % H, 2, 2);
      }

      // Trees
      for (const t of trees) {
        ctx.fillStyle = '#181e28';
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0d1016';
        ctx.beginPath();
        ctx.arc(t.x - 2, t.y - 2, t.r * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Exit Gateway
      const glow = Math.sin(time * 0.1) * 3;
      ctx.fillStyle = '#3a4a2a';
      ctx.fillRect(exit.x - 2, exit.y - 2, exit.w + 4, exit.h + 4);
      ctx.fillStyle = '#d3b15f';
      ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
      ctx.fillStyle = '#fff4cc';
      ctx.fillRect(exit.x + 4 - glow/2, exit.y + 4 - glow/2, exit.w - 8 + glow, exit.h - 8 + glow);

      // Shadows
      for (const s of shadows) {
        const pulse = Math.sin(time * 0.1 + s.x) * 2;
        ctx.fillStyle = lightOn ? 'rgba(35, 25, 45, 0.4)' : 'rgba(12, 6, 20, 0.9)';
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.size + pulse, s.size * 0.7 + pulse * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        if (!lightOn) {
          ctx.fillStyle = '#ff2a4a';
          ctx.fillRect(s.x - 3, s.y - 2, 2, 2);
          ctx.fillRect(s.x + 2, s.y - 2, 2, 2);
        }
      }

      // Player
      ctx.fillStyle = lightOn ? '#f4ecd8' : '#a39268';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#d3b15f';
      ctx.fillRect(player.x + 2, player.y - 4, 6, 5);

      // Flashlight Cone
      if (lightOn) {
        const grd = ctx.createRadialGradient(
          player.x + 5, player.y + 5, 4,
          player.x + 5, player.y + 5, 80
        );
        grd.addColorStop(0, 'rgba(211,177,95,0.35)');
        grd.addColorStop(0.7, 'rgba(211,177,95,0.1)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
      }

      // Vignette
      const vig = ctx.createRadialGradient(player.x + 5, player.y + 5, lightOn ? 70 : 25, player.x + 5, player.y + 5, 180);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(5,6,9,0.92)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
