// --- AUDIO SYNTHESIZER ---
class RetroAudio {
  constructor() {
    this.ctx = null;
    this.soundOn = true;
  }
  init() {
    if (!this.ctx) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      } catch(e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  beep(freq = 750, dur = 0.04) {
    if (!this.soundOn || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch(e){}
  }
  select() {
    if (!this.soundOn || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(880, now + 0.03);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch(e){}
  }
  hit() {
    if (!this.soundOn || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const bufSize = Math.floor(this.ctx.sampleRate * 0.12);
      const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    } catch(e){}
  }
  levelUp() {
    if (!this.soundOn || !this.ctx) return;
    try {
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.07);
        osc.stop(this.ctx.currentTime + idx * 0.07 + 0.09);
      });
    } catch(e){}
  }
}

// Helper: Factory creates dynamic RPG Monster Instances
function createMonster(speciesKey, level = 5) {
  const base = SPECIES[speciesKey];
  const maxHp = Math.floor((base.baseHp * 2 * level) / 100) + level + 10;
  const atk = Math.floor((base.baseAtk * 2 * level) / 100) + 5;
  const def = Math.floor((base.baseDef * 2 * level) / 100) + 5;
  const spd = Math.floor((base.baseSpd * 2 * level) / 100) + 5;

  const moveData = base.moves.map(mName => {
    const m = MOVES[mName];
    return { name: m.name, pp: m.maxPp, maxPp: m.maxPp };
  });

  return {
    speciesKey,
    name: base.name,
    type: base.type,
    level,
    exp: 0,
    expNext: level * level * 8,
    maxHp,
    hp: maxHp,
    atk,
    def,
    spd,
    moves: moveData
  };
}

ctx.imageSmoothingEnabled = false;

function isSolid(x, y) {
  if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return true;
  const tile = mapData[y * MAP_W + x];
  return tile === 1 || tile === 5;
}

// Menu indices & tracking
let mainMenuIdx = 0;
let settingsIdx = 0;
let pauseMenuIdx = 0;
let bagMenuIdx = 0;
let partyMenuIdx = 0;
let hasSavedFile = false;
let blinkTimer = 0;

let dialogueLines = [];
let dialogueIdx = 0;
let dialogueCallback = null;
let activeChoice = null;
let battle = null;
let hudNotice = "";
let hudNoticeTimer = 0;

function checkExistingSave() {
  const d = Storage.get('bayang_save_rpg_master');
  hasSavedFile = !!d;
}
checkExistingSave();

function saveGame() {
  const payload = {
    player,
    settings
  };
  Storage.set('bayang_save_rpg_master', JSON.stringify(payload));
  hudNotice = "Permainan Disimpan!";
  hudNoticeTimer = 70;
  hasSavedFile = true;
  audio.select();
}

function loadGame() {
  const raw = Storage.get('bayang_save_rpg_master');
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    player.x = data.player.x;
    player.y = data.player.y;
    player.chapter = data.player.chapter;
    player.hasKarat = data.player.hasKarat;
    player.party = data.player.party;
    player.bag = data.player.bag;
    player.steps = data.player.steps || 0;
    if (data.settings) {
      settings.textSpeed = data.settings.textSpeed;
      settings.sound = data.settings.sound;
      audio.soundOn = settings.sound;
    }
    return true;
  } catch(e) {
    return false;
  }
}

function startDialogue(lines, cb = null) {
  dialogueLines = lines;
  dialogueIdx = 0;
  dialogueCallback = cb;
  gameState = STATE.DIALOGUE;
  audio.beep(850, 0.03);
}

function startChoice(prompt, optionA, optionB, onSelect) {
  activeChoice = {
    prompt,
    optA: optionA,
    optB: optionB,
    selected: 0,
    callback: onSelect
  };
  gameState = STATE.CHOICE;
  audio.select();

// --- BATTLE SYSTEM ---
function startBattle(enemySpeciesKey, enemyLevel = 6, onWin = null) {
  const playerMon = player.party[0];
  const enemyMon = createMonster(enemySpeciesKey, enemyLevel);

  battle = {
    playerMon,
    enemyMon,
    menuIdx: 0,
    turnState: 'PLAYER_INPUT',
    log: [`Seekor ${enemyMon.name} (Tahap ${enemyMon.level}) muncul!`],
    onWin
  };
  gameState = STATE.BATTLE;
  audio.select();
}

function executePlayerMove(moveIndex) {
  const moveObj = battle.playerMon.moves[moveIndex];
  const ref = MOVES[moveObj.name];

  if (moveObj.pp <= 0) {
    battle.log = ["PP langkah ini telah habis!"];
    audio.beep(300, 0.08);
    return;
  }

  moveObj.pp--;
  battle.turnState = 'BUSY';
  battle.log = [`${battle.playerMon.name} guna ${moveObj.name}!`];
  audio.hit();

  setTimeout(() => {
    if (Math.random() * 100 > ref.acc) {
      battle.log.push(`${battle.playerMon.name} tersasar!`);
    } else {
      if (ref.buffDef) {
        battle.playerMon.def += 4;
        battle.log.push(`Pertahanan Karat meningkat!`);
      }
      if (ref.power > 0) {
        const dmg = Math.max(4, Math.floor((battle.playerMon.atk * ref.power) / (battle.enemyMon.def + 8)));
        battle.enemyMon.hp = Math.max(0, battle.enemyMon.hp - dmg);
        battle.log.push(`Memberi ${dmg} kerosakan.`);
        if (ref.drain) {
          const heal = Math.floor(dmg * ref.drain);
          battle.playerMon.hp = Math.min(battle.playerMon.maxHp, battle.playerMon.hp + heal);
          battle.log.push(`${battle.playerMon.name} menyerap ${heal} HP.`);
        }
      }
    }

    if (battle.enemyMon.hp <= 0) {
      setTimeout(() => {
        battle.log = [`${battle.enemyMon.name} tumpas!`];
        const gainExp = battle.enemyMon.level * 18;
        battle.playerMon.exp += gainExp;
        battle.log.push(`${battle.playerMon.name} raih ${gainExp} EXP!`);
        audio.select();

        // Level Up check
        if (battle.playerMon.exp >= battle.playerMon.expNext) {
          battle.playerMon.level++;
          battle.playerMon.exp -= battle.playerMon.expNext;
          battle.playerMon.expNext = battle.playerMon.level * battle.playerMon.level * 8;
          battle.playerMon.maxHp += 5;
          battle.playerMon.hp = battle.playerMon.maxHp;
          battle.playerMon.atk += 2;
          battle.playerMon.def += 2;
          battle.log.push(`Tahap ${battle.playerMon.level} dicapai!`);
          audio.levelUp();
        }

        setTimeout(() => {
          const winCb = battle.onWin;
          battle = null;
          gameState = STATE.OVERWORLD;
          saveGame();
          if (winCb) winCb();
        }, 1200);
      }, 700);
      return;
    }

    setTimeout(executeEnemyTurn, 900);
  }, 700);
}

function executeEnemyTurn() {
  const moveObj = battle.enemyMon.moves[Math.floor(Math.random() * battle.enemyMon.moves.length)];
  const ref = MOVES[moveObj.name];
  battle.log = [`${battle.enemyMon.name} musuh guna ${ref.name}!`];
  audio.hit();

  setTimeout(() => {
    if (ref.power > 0) {
      const dmg = Math.max(4, Math.floor((battle.enemyMon.atk * ref.power) / (battle.playerMon.def + 8)));
      battle.playerMon.hp = Math.max(0, battle.playerMon.hp - dmg);
      battle.log.push(`Karat menerima ${dmg} kerosakan!`);
    }

    if (battle.playerMon.hp <= 0) {
      setTimeout(() => {
        battle.log = [`${battle.playerMon.name} keletihan...`];
        setTimeout(() => {
          battle.playerMon.hp = battle.playerMon.maxHp;
          gameState = STATE.OVERWORLD;
          startDialogue(["Pasukan keletihan. Danial kembali berehat di bangku bengkel."]);
        }, 1100);
      }, 600);
      return;
    }

    battle.turnState = 'PLAYER_INPUT';
    battle.log = ["Pilih langkah serangan:"];
  }, 700);
}

// --- SPRITE RENDERER ---
function drawBeast(key, x, y, isBack = false) {
  ctx.save();
  ctx.translate(x, y);

  if (key === "KARAT") {
    ctx.fillStyle = '#69717d';
    ctx.fillRect(4, 8, 24, 18);
    ctx.fillStyle = '#945b34';
    ctx.fillRect(8, 12, 16, 10);
    ctx.fillStyle = '#1c222e';
    ctx.fillRect(6, 26, 6, 6);
    ctx.fillRect(20, 26, 6, 6);
    ctx.fillStyle = isBack ? '#47536e' : '#00f0ff';
    if (!isBack) {
      ctx.fillRect(10, 12, 4, 3);
      ctx.fillRect(18, 12, 4, 3);
    }
  } else if (key === "GETAH") {
    ctx.fillStyle = '#2d5a3f';
    ctx.beginPath();
    ctx.arc(16, 18, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4ecd8';
    ctx.fillRect(12, 8, 8, 8);
  } else if (key === "CENCAL") {
    ctx.fillStyle = '#2b3345';
    ctx.fillRect(6, 12, 20, 14);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(3, 10, 6, 6);
    ctx.fillRect(23, 10, 6, 6);
  } else if (key === "LEBURAN") {
    ctx.fillStyle = '#5c3c24';
    ctx.fillRect(4, 4, 24, 24);
    ctx.fillStyle = '#d94b4b';
    ctx.fillRect(8, 8, 16, 16);
    ctx.fillStyle = '#d3b15f';
    ctx.fillRect(12, 12, 8, 8);
  } else {
    ctx.fillStyle = '#777';
    ctx.fillRect(4, 4, 24, 24);
  }
  ctx.restore();
}

// --- UI AND SCENE RENDERING ---
function drawTitleScreen() {
  ctx.fillStyle = '#0b0d13';
  ctx.fillRect(0, 0, 320, 240);

  ctx.fillStyle = '#d3b15f';
  ctx.font = '16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText("BAYANG-BAYANG", 160, 52);

  ctx.font = '10px monospace';
  ctx.fillStyle = '#a3aab5';
  ctx.fillText("SHADOWS OF PERAK (1998)", 160, 70);

  drawBeast("KARAT", 144, 95, false);

  blinkTimer++;
  if (Math.floor(blinkTimer / 30) % 2 === 0) {
    ctx.fillStyle = '#f4ecd8';
    ctx.font = '10px monospace';
    ctx.fillText("- TEKAN [A] ATAU ENTER -", 160, 185);
  }

  ctx.font = '8px monospace';
  ctx.fillStyle = '#69717d';
  ctx.fillText("© 1998 PERAK TIN RESEARCH GROUP", 160, 222);
  ctx.textAlign = 'left';
}

function drawMainMenu() {
  ctx.fillStyle = '#0e1117';
  ctx.fillRect(0, 0, 320, 240);

  ctx.strokeStyle = '#d3b15f';
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 300, 220);

  ctx.fillStyle = '#d3b15f';
  ctx.font = '12px monospace';
  ctx.fillText("PILIHAN UTAMA", 24, 38);

  const opts = [
    { label: "Mula Baru (New Game)", enabled: true },
    { label: "Sambung (Continue)", enabled: hasSavedFile },
    { label: "Tetapan (Settings)", enabled: true }
  ];

  ctx.font = '11px monospace';
  opts.forEach((o, idx) => {
    const isSel = mainMenuIdx === idx;
    if (!o.enabled) ctx.fillStyle = '#4f5666';
    else ctx.fillStyle = isSel ? '#00f0ff' : '#f4ecd8';

    ctx.fillText((isSel ? '▶ ' : '  ') + o.label, 30, 80 + idx * 30);
  });

  if (hasSavedFile) {
    ctx.fillStyle = '#a3aab5';
    ctx.font = '9px monospace';
    ctx.fillText(`Rekod sedia ada: Danial | Bab ${player.chapter}`, 30, 195);
  }
}

function drawSettings() {
  ctx.fillStyle = '#0e1117';
  ctx.fillRect(0, 0, 320, 240);

  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(10, 10, 300, 220);

  ctx.fillStyle = '#d3b15f';
  ctx.font = '12px monospace';
  ctx.fillText("TETAPAN SISTEM", 24, 38);

  const speedNames = ["Pantas", "Sederhana", "Perlahan"];
  const rows = [
    `Kelajuan Teks  : < ${speedNames[settings.textSpeed]} >`,
    `Bunyi Audio    : < ${settings.sound ? 'HIDUP' : 'TUTUP'} >`,
    `Kembali Ke Menu Utama`
  ];

  ctx.font = '10px monospace';
  rows.forEach((r, idx) => {
    const isSel = settingsIdx === idx;
    ctx.fillStyle = isSel ? '#00f0ff' : '#f4ecd8';
    ctx.fillText((isSel ? '▶ ' : '  ') + r, 26, 85 + idx * 32);
  });
}

function drawOverworld() {
  ctx.fillStyle = '#0e1117';
  ctx.fillRect(0, 0, 320, 240);

  const camX = Math.max(0, Math.min(MAP_W * TILE_SIZE - 320, player.x * TILE_SIZE - 160));
  const camY = Math.max(0, Math.min(MAP_H * TILE_SIZE - 240, player.y * TILE_SIZE - 120));

  ctx.save();
  ctx.translate(-camX, -camY);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const tile = mapData[y * MAP_W + x];
      const px = x * TILE_SIZE;
      const py = y * TILE_SIZE;

      if (tile === 0) {
        ctx.fillStyle = '#222831';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (tile === 1) {
        ctx.fillStyle = '#1c3829';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#2d5a3f';
        ctx.fillRect(px + 2, py + 2, 12, 12);
      } else if (tile === 2) {
        ctx.fillStyle = '#2d5a3f';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (tile === 3) {
        ctx.fillStyle = '#5c3c24';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#d3b15f';
        ctx.fillRect(px + 4, py + 4, 8, 8);
      } else if (tile === 4) {
        ctx.fillStyle = '#2b3345';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      } else if (tile === 5) {
        ctx.fillStyle = '#69717d';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Draw Player Avatar
  const plX = player.x * TILE_SIZE;
  const plY = player.y * TILE_SIZE;
  ctx.fillStyle = '#d3b15f';
  ctx.fillRect(plX + 3, plY + 2, 10, 6);
  ctx.fillStyle = '#945b34';
  ctx.fillRect(plX + 2, plY + 8, 12, 8);

  ctx.restore();

  // Top Tracker Bar
  ctx.fillStyle = 'rgba(18, 20, 29, 0.9)';
  ctx.fillRect(4, 4, 150, 22);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(4, 4, 150, 22);
  ctx.fillStyle = '#f4ecd8';
  ctx.font = '9px monospace';
  ctx.fillText(`BAB ${player.chapter}: Pekan Timah`, 8, 18);

  if (hudNoticeTimer > 0) {
    hudNoticeTimer--;
    ctx.fillStyle = '#2d5a3f';
    ctx.fillRect(174, 4, 140, 22);
    ctx.strokeStyle = '#d3b15f';
    ctx.strokeRect(174, 4, 140, 22);
    ctx.fillStyle = '#fff';
    ctx.fillText(hudNotice, 182, 18);
  }
}

function drawPauseMenu() {
  drawOverworld();
  ctx.fillStyle = 'rgba(18, 20, 29, 0.96)';
  ctx.fillRect(180, 20, 130, 195);
  ctx.strokeStyle = '#d3b15f';
  ctx.lineWidth = 2;
  ctx.strokeRect(180, 20, 130, 195);

  const list = [
    "1. Raksasa",
    "2. Beg Poket",
    "3. Danial (ID)",
    "4. Simpan",
    "5. Keluar Menu"
  ];

  ctx.font = '10px monospace';
  list.forEach((item, idx) => {
    const isSel = pauseMenuIdx === idx;
    ctx.fillStyle = isSel ? '#00f0ff' : '#f4ecd8';
    ctx.fillText((isSel ? '▶' : ' ') + item, 188, 48 + idx * 30);
  });
}

function drawPartyView() {
  ctx.fillStyle = '#0e1117';
  ctx.fillRect(0, 0, 320, 240);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(8, 8, 304, 224);

  ctx.fillStyle = '#d3b15f';
  ctx.font = '11px monospace';
  ctx.fillText("PASUKAN RAKSASA DANIAL", 18, 28);

  if (player.party.length === 0) {
    ctx.fillStyle = '#a3aab5';
    ctx.fillText("Belum ada raksasa menyertai.", 24, 70);
  } else {
    player.party.forEach((p, idx) => {
      const isSel = partyMenuIdx === idx;
      ctx.fillStyle = isSel ? 'rgba(0, 240, 255, 0.15)' : '#181d28';
      ctx.fillRect(18, 44 + idx * 72, 284, 64);
      ctx.strokeStyle = isSel ? '#00f0ff' : '#69717d';
      ctx.strokeRect(18, 44 + idx * 72, 284, 64);

      drawBeast(p.speciesKey, 24, 52 + idx * 72);

      ctx.fillStyle = '#f4ecd8';
      ctx.font = '10px monospace';
      ctx.fillText(`${p.name}  Lv.${p.level} [${p.type}]`, 68, 62 + idx * 72);
      ctx.fillText(`HP: ${p.hp}/${p.maxHp}  EXP: ${p.exp}/${p.expNext}`, 68, 78 + idx * 72);

      const mNames = p.moves.map(m => `${m.name}(${m.pp})`).join(" ");
      ctx.fillStyle = '#a3aab5';
      ctx.font = '8px monospace';
      ctx.fillText(mNames, 68, 94 + idx * 72);
    });
  }

  ctx.fillStyle = '#d3b15f';
  ctx.font = '9px monospace';
  ctx.fillText("[B]: Kembali Ke Menu", 18, 220);
}

function drawBagView() {
  ctx.fillStyle = '#0e1117';
  ctx.fillRect(0, 0, 320, 240);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(8, 8, 304, 224);

  ctx.fillStyle = '#d3b15f';
  ctx.font = '11px monospace';
  ctx.fillText("BEG GALAS DANIAL", 18, 28);

  player.bag.forEach((it, idx) => {
    const isSel = bagMenuIdx === idx;
    ctx.fillStyle = isSel ? '#00f0ff' : '#f4ecd8';
    ctx.font = '10px monospace';
    ctx.fillText((isSel ? '▶ ' : '  ') + `${it.name} x${it.count}`, 24, 60 + idx * 26);
  });

  const selItem = player.bag[bagMenuIdx];
  if (selItem) {
    ctx.fillStyle = '#181d28';
    ctx.fillRect(18, 145, 284, 55);
    ctx.strokeStyle = '#d3b15f';
    ctx.strokeRect(18, 145, 284, 55);
    ctx.fillStyle = '#f4ecd8';
    ctx.font = '9px monospace';
    ctx.fillText(selItem.desc, 26, 175);
  }

  ctx.fillStyle = '#d3b15f';
  ctx.font = '9px monospace';
  ctx.fillText("[A]: Guna Barangan | [B]: Kembali", 18, 220);
}

function drawDialogueBox() {
  ctx.fillStyle = '#12141d';
  ctx.fillRect(8, 160, 304, 72);
  ctx.strokeStyle = '#d3b15f';
  ctx.lineWidth = 2;
  ctx.strokeRect(8, 160, 304, 72);

  ctx.fillStyle = '#f4ecd8';
  ctx.font = '10px monospace';
  const text = dialogueLines[dialogueIdx] || '';
  
  const words = text.split(" ");
  let l1 = "";
  let l2 = "";
  for (let i = 0; i < words.length; i++) {
    if (i < 6) l1 += words[i] + " ";
    else l2 += words[i] + " ";
  }
  ctx.fillText(l1, 16, 184);
  ctx.fillText(l2, 16, 204);

  ctx.fillStyle = '#d3b15f';
  ctx.fillText('[A] Seterusnya ▶', 200, 224);
}

function drawChoiceBox() {
  drawDialogueBox();
  ctx.fillStyle = '#12141d';
  ctx.fillRect(150, 90, 160, 65);
  ctx.strokeStyle = '#d3b15f';
  ctx.lineWidth = 2;
  ctx.strokeRect(150, 90, 160, 65);

  ctx.font = '10px monospace';
  ctx.fillStyle = activeChoice.selected === 0 ? '#00f0ff' : '#f4ecd8';
  ctx.fillText((activeChoice.selected === 0 ? '▶ ' : '  ') + activeChoice.optA, 156, 115);

  ctx.fillStyle = activeChoice.selected === 1 ? '#00f0ff' : '#f4ecd8';
  ctx.fillText((activeChoice.selected === 1 ? '▶ ' : '  ') + activeChoice.optB, 156, 138);
}

function drawBattle() {
  ctx.fillStyle = '#1a1f2c';
  ctx.fillRect(0, 0, 320, 240);

  ctx.fillStyle = '#2d5a3f';
  ctx.beginPath();
  ctx.ellipse(230, 80, 50, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(80, 145, 55, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  drawBeast(battle.enemyMon.speciesKey, 215, 52, false);
  drawBeast(battle.playerMon.speciesKey, 65, 115, true);

  // Enemy Box
  ctx.fillStyle = '#12141d';
  ctx.fillRect(10, 8, 140, 38);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(10, 8, 140, 38);
  ctx.fillStyle = '#f4ecd8';
  ctx.font = '9px monospace';
  ctx.fillText(`${battle.enemyMon.name} Lv.${battle.enemyMon.level}`, 16, 22);
  const eHpPct = battle.enemyMon.hp / battle.enemyMon.maxHp;
  ctx.fillStyle = '#333';
  ctx.fillRect(16, 28, 120, 6);
  ctx.fillStyle = '#d94b4b';
  ctx.fillRect(16, 28, Math.floor(120 * eHpPct), 6);

  // Player Box
  ctx.fillStyle = '#12141d';
  ctx.fillRect(170, 105, 140, 46);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(170, 105, 140, 46);
  ctx.fillStyle = '#f4ecd8';
  ctx.font = '9px monospace';
  ctx.fillText(`${battle.playerMon.name} Lv.${battle.playerMon.level}`, 176, 120);
  const pHpPct = battle.playerMon.hp / battle.playerMon.maxHp;
  ctx.fillStyle = '#333';
  ctx.fillRect(176, 126, 120, 6);
  ctx.fillStyle = '#2d5a3f';
  ctx.fillRect(176, 126, Math.floor(120 * pHpPct), 6);
  ctx.fillText(`${battle.playerMon.hp}/${battle.playerMon.maxHp} HP`, 176, 144);

  // Command Area
  ctx.fillStyle = '#12141d';
  ctx.fillRect(6, 160, 308, 74);
  ctx.strokeStyle = '#d3b15f';
  ctx.strokeRect(6, 160, 308, 74);

  if (battle.turnState === 'PLAYER_INPUT') {
    ctx.fillStyle = '#f4ecd8';
    ctx.font = '9px monospace';
    battle.playerMon.moves.forEach((m, idx) => {
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const isSel = battle.menuIdx === idx;
      ctx.fillStyle = isSel ? '#00f0ff' : '#f4ecd8';
      ctx.fillText((isSel ? '▶ ' : '  ') + `${m.name} [${m.pp}/${m.maxPp}]`, 16 + col * 145, 184 + row * 22);
    });
  } else {
    ctx.fillStyle = '#f4ecd8';
    ctx.font = '10px monospace';
    battle.log.forEach((l, i) => {
      ctx.fillText(l, 16, 184 + i * 18);
    });
  }
}

// --- MAIN LOOP ---
function gameLoop() {
  ctx.clearRect(0, 0, 320, 240);

  switch (gameState) {
    case STATE.TITLE_SCREEN:
      drawTitleScreen();
      break;
    case STATE.MAIN_MENU:
      drawMainMenu();
      break;
    case STATE.SETTINGS:
      drawSettings();
      break;
    case STATE.OVERWORLD:
      drawOverworld();
      break;
    case STATE.PAUSE_MENU:
      drawPauseMenu();
      break;
    case STATE.PARTY_VIEW:
      drawPartyView();
      break;
    case STATE.BAG_VIEW:
      drawBagView();
      break;
    case STATE.DIALOGUE:
      drawOverworld();
      drawDialogueBox();
      break;
    case STATE.CHOICE:
      drawOverworld();
      drawChoiceBox();
      break;
    case STATE.BATTLE:
      drawBattle();
      break;
    case STATE.ENDING:
      drawEnding();
      break;
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// --- INPUT PROCESSORS ---
function handleInputA() {
  audio.init();

  if (gameState === STATE.TITLE_SCREEN) {
    audio.select();
    checkExistingSave();
    gameState = STATE.MAIN_MENU;
    mainMenuIdx = hasSavedFile ? 1 : 0;
  } else if (gameState === STATE.MAIN_MENU) {
    audio.select();
    if (mainMenuIdx === 0) {
      // New Game
      player.x = 5;
      player.y = 6;
      player.party = [];
      player.hasKarat = false;
      player.chapter = 1;
      gameState = STATE.OVERWORLD;
      startDialogue([
        "Danial tiba di bengkel tinggalan arwah datuk di Pekan Timah.",
        "Khabar angin mengatakan Farah hilang di tapak kuari semalam.",
        "Siasat meja bengkel di atas [KOTAK COKLAT] untuk mencari petunjuk!"
      ]);
    } else if (mainMenuIdx === 1 && hasSavedFile) {
      loadGame();
      gameState = STATE.OVERWORLD;
      hudNotice = "Permainan Disambung!";
      hudNoticeTimer = 70;
    } else if (mainMenuIdx === 2) {
      gameState = STATE.SETTINGS;
      settingsIdx = 0;
    }
  } else if (gameState === STATE.SETTINGS) {
    audio.select();
    if (settingsIdx === 2) {
      saveGame();
      gameState = STATE.MAIN_MENU;
    }
  } else if (gameState === STATE.PAUSE_MENU) {
    audio.select();
    if (pauseMenuIdx === 0) {
      gameState = STATE.PARTY_VIEW;
      partyMenuIdx = 0;
    } else if (pauseMenuIdx === 1) {
      gameState = STATE.BAG_VIEW;
      bagMenuIdx = 0;
    } else if (pauseMenuIdx === 2) {
      startDialogue([
        `KAD ID: ${player.name} | Langkah: ${player.steps}`,
        `Bab Semasa: ${player.chapter} | Raksasa: ${player.party.length}/2`
      ]);
    } else if (pauseMenuIdx === 3) {
      saveGame();
      gameState = STATE.OVERWORLD;
    } else if (pauseMenuIdx === 4) {
      gameState = STATE.OVERWORLD;
    }
  } else if (gameState === STATE.BAG_VIEW) {
    const it = player.bag[bagMenuIdx];
    if (it && it.count > 0 && player.party.length > 0) {
      audio.select();
      it.count--;
      if (it.heal) {
        player.party[0].hp = Math.min(player.party[0].maxHp, player.party[0].hp + it.heal);
        startDialogue([`${it.name} digunakan! ${player.party[0].name} pulih 25 HP.`]);
      } else if (it.restorePp) {
        player.party[0].moves.forEach(m => m.pp = m.maxPp);
        startDialogue([`Kopi O Panas dihirup! Semua PP langkah dipulihkan penuh.`]);
      }
    } else {
      audio.beep(320, 0.05);
    }
  } else if (gameState === STATE.DIALOGUE) {
    dialogueIdx++;
    audio.beep(850, 0.03);
    if (dialogueIdx >= dialogueLines.length) {
      gameState = STATE.OVERWORLD;
      if (dialogueCallback) {
        const cb = dialogueCallback;
        dialogueCallback = null;
        cb();
      }
    }
  } else if (gameState === STATE.CHOICE) {
    audio.select();
    const chosen = activeChoice.selected;
    const cb = activeChoice.callback;
    activeChoice = null;
    gameState = STATE.OVERWORLD;
    if (cb) cb(chosen);
  } else if (gameState === STATE.BATTLE) {
    if (battle && battle.turnState === 'PLAYER_INPUT') {
      audio.select();
      executePlayerMove(battle.menuIdx);
    }
  } else if (gameState === STATE.ENDING) {
    audio.select();
    gameState = STATE.MAIN_MENU;
  }
}

function handleInputB() {
  audio.init();
  if (gameState === STATE.OVERWORLD) {
    pauseMenuIdx = 0;
    gameState = STATE.PAUSE_MENU;
    audio.select();
  } else if (gameState === STATE.PAUSE_MENU || gameState === STATE.PARTY_VIEW || gameState === STATE.BAG_VIEW) {
    gameState = STATE.OVERWORLD;
    audio.beep(400, 0.04);
  } else if (gameState === STATE.SETTINGS) {
    gameState = STATE.MAIN_MENU;
    audio.beep(400, 0.04);
  }
}

function handleMove(dir) {
  audio.init();

  if (gameState === STATE.MAIN_MENU) {
    if (dir === 'up') mainMenuIdx = Math.max(0, mainMenuIdx - 1);
    if (dir === 'down') mainMenuIdx = Math.min(2, mainMenuIdx + 1);
    audio.select();
    return;
  }

  if (gameState === STATE.SETTINGS) {
    if (dir === 'up') settingsIdx = Math.max(0, settingsIdx - 1);
    if (dir === 'down') settingsIdx = Math.min(2, settingsIdx + 1);
    if (dir === 'left' || dir === 'right') {
      if (settingsIdx === 0) settings.textSpeed = (settings.textSpeed + 1) % 3;
      if (settingsIdx === 1) {
        settings.sound = !settings.sound;
        audio.soundOn = settings.sound;
      }
    }
    audio.select();
    return;
  }

  if (gameState === STATE.PAUSE_MENU) {
    if (dir === 'up') pauseMenuIdx = Math.max(0, pauseMenuIdx - 1);
    if (dir === 'down') pauseMenuIdx = Math.min(4, pauseMenuIdx + 1);
    audio.select();
    return;
  }

  if (gameState === STATE.BAG_VIEW) {
    if (dir === 'up') bagMenuIdx = Math.max(0, bagMenuIdx - 1);
    if (dir === 'down') bagMenuIdx = Math.min(player.bag.length - 1, bagMenuIdx + 1);
    audio.select();
    return;
  }

  if (gameState === STATE.CHOICE) {
    if (dir === 'up') activeChoice.selected = 0;
    if (dir === 'down') activeChoice.selected = 1;
    audio.select();
    return;
  }

  if (gameState === STATE.BATTLE) {
    if (battle && battle.turnState === 'PLAYER_INPUT') {
      if (dir === 'left') battle.menuIdx = Math.max(0, battle.menuIdx - 1);
      if (dir === 'right') battle.menuIdx = Math.min(battle.playerMon.moves.length - 1, battle.menuIdx + 1);
      if (dir === 'up') battle.menuIdx = Math.max(0, battle.menuIdx - 2);
      if (dir === 'down') battle.menuIdx = Math.min(battle.playerMon.moves.length - 1, battle.menuIdx + 2);
      audio.select();
    }
    return;
  }

  if (gameState !== STATE.OVERWORLD) return;

  let nx = player.x;
  let ny = player.y;

  if (dir === 'up') ny--;
  if (dir === 'down') ny++;
  if (dir === 'left') nx--;
  if (dir === 'right') nx++;

  if (!isSolid(nx, ny)) {
    player.x = nx;
    player.y = ny;
    player.steps++;
    audio.beep(240, 0.02);
    checkTriggers();
  }
}

function checkTriggers() {
  // Tile 3: Inspect grandfather's workbench
  if (player.x === 2 && player.y === 2 && !player.hasKarat) {
    player.hasKarat = true;
    player.party.push(createMonster("KARAT", 5));
    saveGame();
    startDialogue([
      "Danial membuka laci meja dan menjumpai kompas tembaga datuk!",
      "Karat, anjing mekanikal berkarat milik datuk terbangun!",
      "Karat menyertai pasukan! Sekarang keluar ke kebun getah di kanan."
    ]);
  }

  // Chapter 1 Choice trigger
  if (player.hasKarat && player.x >= 10 && player.x <= 12 && player.y === 2 && player.chapter === 1) {
    player.chapter = 2;
    startDialogue([
      "Di tepi parit kebun getah, terdapat dua kelibat aneh!",
      "Seekor Getah terperangkap di mangkuk getah.",
      "Seekor Cencal sedang mengacah di bibir parit air!"
    ], () => {
      startChoice("Pilih rakan kedua:", "Bantu GETAH (Flora)", "Tangkap CENCAL (Water)", (choice) => {
        if (choice === 0) {
          player.party.push(createMonster("GETAH", 5));
          saveGame();
          startDialogue(["Getah menyertai pasukan!", "Terus mara ke pintu gua kapur di hujung timur!"]);
        } else {
          player.party.push(createMonster("CENCAL", 5));
          saveGame();
          startDialogue(["Cencal menyertai pasukan!", "Terus mara ke pintu gua kapur di hujung timur!"]);
        }
      });
    });
  }

  // Chapter 2 Cave Entrance & Boss
  if (player.chapter === 2 && player.x >= 16 && player.y >= 11) {
    player.chapter = 3;
    startDialogue([
      "Anda temui Farah di dalam gua!",
      "Farah: 'Danial! Ayah saya nak musnahkan gua lombong ini!'",
      "Tauke Razak muncul bersama raksasa pelebur, LEBURAN!"
    ], () => {
      startBattle("LEBURAN", 8, () => {
        gameState = STATE.ENDING;
      });
    });
  }
}
